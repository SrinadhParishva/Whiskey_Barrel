<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Details — Whiskey Barrel</title>
  <meta name="description" content="Explore and buy small-batch single malt aged in charred American oak from Whiskey Barrel.">
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Google Fonts: Domine (Serif Headings) & Hanken Grotesk (Sans-Serif Body & UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;500;600;700&family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="overflow-x-hidden bg-background text-foreground font-body">

  <main class="min-h-screen">
    <!-- Header -->
    <header class="border-b border-border bg-background/80 backdrop-blur-xl">
      <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
        <a href="index.html" class="group flex items-center gap-3">
          <span class="relative flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-full border border-ember/60 bg-background/90 overflow-hidden shadow-sm transition-transform duration-500 group-hover:scale-105 nav-logo-icon">
            <img src="assets/wb-icon.png" alt="WB Logo Icon" class="h-full w-full object-cover rounded-full">
          </span>
          <span class="font-display text-base sm:text-lg tracking-[0.25em] uppercase font-bold text-foreground">Whiskey Barrel</span>
        </a>
        <a href="category.html?category=WHISKEY" class="text-xs uppercase tracking-[0.2em] text-muted-foreground hover:text-ember transition-colors">
          Browse Spirits
        </a>
      </nav>
    </header>

    <!-- Product Content Container -->
    <div class="mx-auto max-w-6xl px-6 py-16">
      <a href="category.html?category=WHISKEY" class="inline-flex items-center gap-2 text-xs uppercase tracking-[0.25em] text-muted-foreground transition-colors duration-300 hover:text-ember">
        <i data-lucide="arrow-left" class="h-3.5 w-3.5"></i> Back to Spirits Collection
      </a>

      <!-- Dynamic Loading State -->
      <div id="product-loading" class="flex h-96 items-center justify-center">
        <i data-lucide="loader-2" class="h-6 w-6 animate-spin text-ember"></i>
      </div>

      <!-- Error/Not Found State -->
      <div id="product-not-found" class="hidden mt-20 text-center text-muted-foreground">
        Product not found.
      </div>

      <!-- Dynamic Product Detail Content -->
      <div id="product-details" class="hidden mt-12 grid gap-16 lg:grid-cols-2">
        <!-- Left Side: Image -->
        <div data-reveal="left" class="overflow-hidden rounded-sm border border-border bg-card p-6 flex items-center justify-center">
          <div id="product-image-container" class="w-full h-[500px] flex items-center justify-center">
            <!-- Dynamic Image -->
          </div>
        </div>

        <!-- Right Side: Content -->
        <div data-reveal="right" data-delay="120" class="flex flex-col justify-center">
          <h1 id="product-title" class="font-display font-bold text-4xl sm:text-5xl leading-tight">Loading...</h1>

          <div id="product-badges-container" class="mt-4 flex flex-wrap gap-2">
            <!-- Dynamic badges -->
          </div>

          <div class="mt-6 space-y-2 text-sm text-[#e4e4e7]">
            <div id="product-country" class="font-medium text-base"></div>
            <div id="product-composition" class="text-muted-foreground"></div>
            <div id="product-type" class="text-ember font-semibold"></div>
          </div>

          <div class="mt-8 border-t border-border/40 pt-6">
            <div class="text-xs uppercase tracking-[0.25em] text-muted-foreground font-semibold">MRP</div>
            <p id="product-price" class="font-display text-4xl font-bold text-ember mt-1">$0.00</p>
          </div>

          <p id="product-description" class="mt-8 whitespace-pre-line leading-relaxed text-muted-foreground text-base">
            Loading description...
          </p>

          <!-- Variants Selector Container -->
          <div id="product-variants-container" class="hidden mt-8">
            <p class="text-[0.65rem] uppercase tracking-[0.3em] text-muted-foreground">Available Sizes</p>
            <div id="product-variants-buttons" class="mt-3 flex flex-wrap gap-3">
              <!-- Dynamically populated buttons -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-border px-6 py-10 mt-20">
      <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-4 text-[0.65rem] uppercase tracking-[0.25em] text-muted-foreground sm:flex-row">
        <span>© 2026 Whiskey Barrel Distillery</span>
        <span>Please savour responsibly</span>
      </div>
    </footer>
  </main>

  <!-- Cart Drawer Component Markup -->
  <div id="cart-drawer-overlay" class="fixed inset-0 z-[100] bg-black/60 opacity-0 pointer-events-none transition-opacity duration-300 backdrop-blur-sm"></div>
  <aside id="cart-drawer" class="fixed right-0 top-0 bottom-0 z-[101] flex h-full w-full translate-x-full flex-col bg-card sm:max-w-lg transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] border-l border-border">
    <div class="flex items-center justify-between px-6 py-6 border-b border-border">
      <div>
        <h2 class="font-display text-2xl">Your Cart</h2>
        <p id="cart-description" class="text-xs text-muted-foreground">Your cart is empty</p>
      </div>
      <button type="button" id="cart-close-btn" aria-label="Close cart" class="text-muted-foreground hover:text-foreground transition-colors p-1">
        <i data-lucide="x" class="h-6 w-6"></i>
      </button>
    </div>

    <div class="flex min-h-0 flex-1 flex-col px-6 pt-6 overflow-y-auto">
      <!-- Empty Cart State -->
      <div id="cart-empty-state" class="flex flex-1 items-center justify-center">
        <div class="text-center">
          <i data-lucide="shopping-cart" class="mx-auto mb-4 h-12 w-12 text-muted-foreground"></i>
          <p class="text-muted-foreground">Your cart is empty</p>
        </div>
      </div>

      <!-- Cart Items State -->
      <div id="cart-items-container" class="hidden flex-1 overflow-y-auto pr-2 space-y-4">
        <!-- Rendered dynamically -->
      </div>

      <!-- Cart Footer -->
      <div id="cart-footer" class="hidden flex-shrink-0 space-y-4 border-t border-border bg-card pt-4 pb-6">
        <div class="flex items-center justify-between">
          <span class="text-sm uppercase tracking-[0.2em] text-muted-foreground">Total</span>
          <span id="cart-total-price" class="font-display text-2xl text-ember">$0.00</span>
        </div>
        <button type="button" id="cart-checkout-btn" class="flex w-full items-center justify-center gap-2 rounded-sm bg-[image:var(--gradient-ember)] px-6 py-4 text-xs uppercase tracking-[0.25em] text-primary-foreground transition-all duration-500 hover:shadow-ember disabled:opacity-60">
          <i data-lucide="external-link" class="h-4 w-4"></i>
          Checkout with Shopify
        </button>
      </div>
    </div>
  </aside>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
